name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o vitryn ./cmd/vitryn && ls -lh vitryn
      - name: vitryn-ts (Tailscale build)
        working-directory: tailscale
        env:
          GOTOOLCHAIN: auto # tsnet needs a newer Go than the main module
        run: go vet . && CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o vitryn-ts . && ls -lh vitryn-ts
  cloudflare:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
