name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o glasshelf ./cmd/glasshelf && ls -lh glasshelf
      - name: glasshelf-ts (Tailscale build)
        working-directory: tailscale
        run: go vet . && CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o glasshelf-ts . && ls -lh glasshelf-ts
  cloudflare:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test
