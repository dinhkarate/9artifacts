# nginx in front of vitryn (certificates managed elsewhere, e.g. certbot).
# vitryn serve --addr 127.0.0.1:8080 --url https://art.example.com \
#   --content-url https://art-content.example.com --trust-proxy
server {
    listen 443 ssl;
    http2 on;
    server_name art.example.com art-content.example.com;
    ssl_certificate     /etc/letsencrypt/live/art.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/art.example.com/privkey.pem;

    client_max_body_size 100m;
    access_log off;   # URLs contain share tokens; vitryn logs requests with tokens redacted

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
