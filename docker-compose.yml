# docker compose up -d   then open the first-run link from: docker compose logs vitryn
services:
  vitryn:
    image: ghcr.io/dinhkarate/vitryn:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # put Caddy/nginx/Cloudflare Tunnel in front
    environment:
      VITRYN_URL: https://art.example.com
      # VITRYN_CONTENT_URL: https://art-content.example.com   # recommended
      VITRYN_TRUST_PROXY: "1"
    volumes:
      - vitryn-data:/data
volumes:
  vitryn-data:
