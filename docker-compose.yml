# docker compose up -d   then open the first-run link from: docker compose logs glasshelf
services:
  glasshelf:
    image: ghcr.io/dinhkarate/glasshelf:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # put Caddy/nginx/Cloudflare Tunnel in front
    environment:
      GLASSHELF_URL: https://art.example.com
      # GLASSHELF_CONTENT_URL: https://art-content.example.com   # recommended
      GLASSHELF_TRUST_PROXY: "1"
    volumes:
      - glasshelf-data:/data
volumes:
  glasshelf-data:
